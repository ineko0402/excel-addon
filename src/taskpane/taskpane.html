<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excelユーティリティ</title>

    <!-- Office JavaScript API -->
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link
      rel="stylesheet"
      href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"
    />

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
  </head>

<body>
  <header class="app-header">
    <img
      class="app-logo"
      src="../../assets/toolbox-icon-64.png"
      alt=""
      aria-hidden="true"
    />
    <h1>Excelユーティリティ</h1>
  </header>

  <nav class="tab-list" aria-label="機能切替">
    <button
      id="tab-sheet"
      class="tab-button active"
      type="button"
      aria-selected="true"
    >
      シートナビ
    </button>

    <button
      id="tab-calendar"
      class="tab-button"
      type="button"
      aria-selected="false"
    >
      カレンダー
    </button>

    <button
      id="tab-postal"
      class="tab-button"
      type="button"
      aria-selected="false"
    >
      郵便番号
    </button>

    <button
      id="tab-settings"
      class="tab-button"
      type="button"
      aria-selected="false"
    >
      設定
    </button>
  </nav>

  <main class="app-main">
    <div id="message" class="message" role="status"></div>

    <section id="sheet-panel" class="panel">
      <div class="section-header">
        <h2>シートナビ</h2>
        <button id="refresh-sheets" class="secondary-button" type="button">
          更新
        </button>
      </div>

      <label class="visually-hidden" for="sheet-search">
        シート名を検索
      </label>

      <input
        id="sheet-search"
        class="sheet-search"
        type="search"
        placeholder="シート名を検索"
        autocomplete="off"
      />

      <div id="sheet-list" class="sheet-list"></div>
    </section>

    <section id="calendar-panel" class="panel hidden">
      <h2>日付入力</h2>

      <label class="field-label" for="date-input">
        入力する日付
      </label>

      <input id="date-input" class="date-input" type="date" />

      <div class="date-format-field">
        <label class="field-label" for="date-format">
          日付の表示形式
        </label>

        <select id="date-format" class="date-format-select">
          <option value="standard">2026/08/19</option>
          <option value="compact">2026/8/19</option>
          <option value="japanese">2026年8月19日</option>
          <option value="iso">2026-08-19</option>
          <option value="monthDay">8/19</option>
          <option value="preserve">既存のセル書式を優先</option>
        </select>
      </div>

      <div class="calendar-buttons">
        <button id="set-today" class="secondary-button" type="button">
          今日を選択
        </button>

        <button id="insert-date" class="primary-button" type="button">
          選択した日付を入力
        </button>
      </div>

      <button
        id="insert-today-formula"
        class="secondary-button today-formula-button"
        type="button"
      >
        TODAY関数を入力
      </button>

      <p class="description">
        複数のセルを選択している場合は、左上のセルに入力します。
        TODAY関数は再計算時に当日の日付へ更新されます。
      </p>
    </section>

    <section id="postal-panel" class="panel hidden">
      <h2>郵便番号検索・簡易確認</h2>

      <p class="description">
        郵便番号セルを選択してください。右隣のセルを住所として扱います。
        住所確認は郵便番号の候補との先頭一致による簡易確認です。
      </p>

      <div class="postal-format-field">
        <label class="field-label" for="postal-format">
          郵便番号の保存形式
        </label>

        <select id="postal-format" class="postal-format-select">
          <option value="hyphen">123-4567</option>
          <option value="plain">1234567</option>
        </select>
      </div>

      <div class="postal-actions">
        <button id="search-postal" class="primary-button" type="button">
          住所を検索・入力
        </button>

        <button id="verify-postal" class="secondary-button" type="button">
          入力済み住所を簡易確認
        </button>
      </div>

      <div
        id="postal-status"
        class="postal-status normal"
        role="status"
      ></div>

      <div id="postal-results" class="postal-results"></div>
    </section>

    <section id="settings-panel" class="panel hidden">
      <h2>設定</h2>

      <p class="description">
        日付形式と郵便番号形式を初期状態へ戻します。
      </p>

      <button
        id="reset-settings"
        class="secondary-button reset-settings-button"
        type="button"
      >
        設定を初期状態に戻す
      </button>

      <p id="app-version" class="version-text"></p>

      <p class="description">
        郵便番号検索は外部サービスのZipCloudを利用します。
        サービス停止中でもシートナビと日付入力は利用できます。
      </p>
    </section>
  </main>
</body>
</html>
